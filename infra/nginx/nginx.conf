upstream gateway {
    server gateway:8000;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 60s;

    error_page 413 = @file_too_large;
    location @file_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":"FILE_TOO_LARGE","message":"파일은 20MB를 넘을 수 없습니다.","retryable":false}';
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/chat/messages/stream {
        proxy_pass http://gateway;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        proxy_read_timeout 420s;
        proxy_send_timeout 420s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, no-transform" always;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location = /api/chat/ws {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 2100s;
        proxy_send_timeout 2100s;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location = /api/chat/messages {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location = /api/knowledge/documents {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        client_max_body_size 21m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location ~ ^/api/knowledge/documents/[0-9]+$ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        client_max_body_size 21m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location ~ ^/api/knowledge/documents/[0-9]+/reindex$ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        include /etc/nginx/conf.d/forwarded.inc;
    }

    location = /healthz {
        proxy_pass http://gateway;
        access_log off;
        include /etc/nginx/conf.d/forwarded.inc;
    }

    location = /readyz {
        proxy_pass http://gateway;
        access_log off;
        include /etc/nginx/conf.d/forwarded.inc;
    }
}
