name: personal-engineering-assistant

services:

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: engineering_assistant
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d engineering_assistant"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/engineering_assistant
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      OLLAMA_BASEURL: http://ollama:11434

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 21MB

      SERVER_FORWARDHEADERSSTRATEGY: framework
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    expose:
      - "8080"
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_LISTEN_ADDR: ":8000"
      GATEWAY_BACKEND_URL: http://backend:8080

      GATEWAY_TRUST_PROXY_HEADERS: "true"

      GATEWAY_STREAM_TIMEOUT: 360s
      GATEWAY_PROXY_TIMEOUT: 30s

      GATEWAY_SLOW_TIMEOUT: 240s

      GATEWAY_WEBSOCKET_TIMEOUT: 30m

      GATEWAY_RATE_LIMIT_ENABLED: "true"
      GATEWAY_RATE_LIMIT_BURST: "120"
      GATEWAY_RATE_LIMIT_REFILL: 1s

      GATEWAY_BACKEND_HEALTH_PATH: /actuator/health
    depends_on:
      backend:
        condition: service_started
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/forwarded.inc:/etc/nginx/conf.d/forwarded.inc:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  prometheus:
